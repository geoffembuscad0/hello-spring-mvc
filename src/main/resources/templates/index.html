<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot + Tailwind CSS</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center">
    <div class="text-center">
        <h1 class="text-5xl font-bold text-white mb-4" th:text="${message}">
            Hello World!
        </h1>
        <p class="text-slate-400 text-lg">
            Welcome to Spring Boot with Tailwind CSS.
        </p>
        <button class="mt-8 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            Get Started
        </button>
    </div>
</body>
</html>
